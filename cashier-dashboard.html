<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Floréa — Cashier Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/florea-logo-192.png">
    <link rel="stylesheet" href="florea-prototype.css">
    <script src="florea-orders.js"></script>
    <style>
        .cashier-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 24px;
            height: calc(100vh - 100px);
            overflow: auto;
            background: var(--cream-deep);
        }
        
        .cashier-section {
            display: flex;
            flex-direction: column;
            background: var(--paper);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .cashier-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .order-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .order-card {
            background: var(--cream);
            border-left: 4px solid var(--sage);
            border-radius: var(--radius-sm);
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .order-card:hover {
            box-shadow: 0 4px 12px rgba(59, 47, 42, .12);
            transform: translateY(-2px);
        }
        
        .order-card.new {
            border-left-color: var(--danger);
            background: rgba(193, 89, 78, 0.08);
            animation: pulse 1s infinite;
        }

        .order-card.new.overdue {
            border-left-width: 6px;
            background: #FFF0ED;
            box-shadow: inset 0 0 0 1px rgba(193, 89, 78, .22);
            animation: none;
        }
        
        .order-card.new::before {
            content: "NEW";
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--danger);
            background: rgba(193, 89, 78, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
        }
        
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(193, 89, 78, 0.7);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(193, 89, 78, 0);
            }
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }
        
        .order-id {
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-mono);
            font-size: 13px;
        }
        
        .order-customer {
            margin-top: 4px;
            font-size: 13px;
            color: var(--ink);
        }
        
        .order-time {
            font-size: 12px;
            color: #554941;
            font-family: var(--font-mono);
        }

        .order-time.overdue {
            color: #A33127;
            font-weight: 700;
        }

        .overdue-label {
            display: inline-block;
            margin-top: 6px;
            color: #A33127;
            font-size: 11px;
            font-weight: 700;
        }
        
        .order-details {
            font-size: 13px;
            color: #554941;
            margin: 8px 0;
            line-height: 1.5;
        }
        
        .order-items {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            color: var(--ink);
            max-height: 80px;
            overflow-y: auto;
        }
        
        .order-status {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending {
            background: #F6DEDA;
            color: #A33127;
        }
        
        .status-preparing {
            background: #F3E7CC;
            color: #765719;
        }
        
        .status-ready {
            background: #DCE4D3;
            color: #3F5732;
        }

        .stat-value.stat-pending { color: #A33127; }
        .stat-value.stat-preparing { color: #765719; }
        .stat-value.stat-ready { color: #3F5732; }

        .stat-label { color: #554941; }

        .empty-state {
            min-height: 180px;
            color: #554941;
        }

        .order-list > .empty-state {
            height: auto;
            flex: 1;
        }
        
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .order-actions button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-accept {
            background: var(--forest);
            color: #FBF7F1;
        }
        
        .btn-accept:hover {
            background: var(--forest-deep);
        }
        
        .btn-complete {
            background: var(--forest-light);
            color: var(--forest);
        }
        
        .btn-complete:hover {
            background: var(--sage-deep);
            color: #FBF7F1;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px 24px;
            background: var(--cream);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-mono);
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--ink-soft);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--ink-soft);
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .notification-sound {
            display: none;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .dashboard-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
        }
        
        .dashboard-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .cashier-bell-toggle {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--paper);
            color: var(--ink);
            font: inherit;
            cursor: pointer;
        }

        .cashier-bell-toggle:focus-visible {
            outline: 2px solid var(--forest);
            outline-offset: 2px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--forest-light);
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        @media (max-width: 1200px) {
            .cashier-container {
                grid-template-columns: 1fr;
            }
            .cashier-section {
                min-height: 320px;
            }
        }
    </style>
</head>

<body>
    <div class="app" style="flex-direction: column;">

        <!-- TOPBAR -->
        <div class="topbar">
            <div>
                <h1 class="dashboard-title">🍃 Cashier Dashboard</h1>
            </div>
            <div class="dashboard-status">
                <span class="status-indicator"></span>
                <span>Live Orders: <b id="live-count">0</b></span>
                <span>•</span>
                <span>Time: <span id="current-time">--:--</span></span>
                <button type="button" class="cashier-bell-toggle" aria-pressed="true" onclick="toggleCashierBell(this)">🔔 Bell on</button>
            </div>
        </div>

        <!-- STATS BAR -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value stat-pending" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat">
                <div class="stat-value stat-preparing" id="preparing-count">0</div>
                <div class="stat-label">Preparing</div>
            </div>
            <div class="stat">
                <div class="stat-value stat-ready" id="ready-count">0</div>
                <div class="stat-label">Ready</div>
            </div>
        </div>

        <!-- MAIN CONTAINER -->
        <div class="cashier-container">

            <!-- NEW ORDERS SECTION -->
            <div class="cashier-section">
                <h2>📬 New Orders</h2>
                <div class="order-list" id="new-orders-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">😎</div>
                        <p>No new orders yet</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVE ORDERS SECTION -->
            <div class="cashier-section">
                <h2>⏳ Active Orders</h2>
                <div class="order-list" id="active-orders-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <p>Walang kasalukuyang inihahanda</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="florea-cashier-sound.js"></script>
    <script>
        // ============ ORDER DATA ============
        let orders = [];
        let orderIdCounter = 1001;
        let hasServerOrders = false;
        let hasSyncError = false;

        // Sample order data
        const sampleOrders = [{
            id: 'ORD-1001',
            items: ['Ecuadorian Roses (6pc)', 'Iced Americano (Medium)', 'Croissant'],
            total: '₱ 890',
            table: '12',
            timestamp: new Date(Date.now() - 2 * 60000),
            status: 'new'
        }, {
            id: 'ORD-1002',
            items: ['Sunflower Stem (3)', 'Americano (Medium)'],
            total: '₱ 450',
            table: '08',
            timestamp: new Date(Date.now() - 5 * 60000),
            status: 'new'
        }, {
            id: 'ORD-1003',
            items: ['Sweetheart Peony Bouquet', 'Spanish Latte (Medium)'],
            total: '₱ 1,109',
            table: '05',
            timestamp: new Date(Date.now() - 8 * 60000),
            status: 'preparing'
        }];

        // ============ DOM ELEMENTS ============
        const newOrdersList = document.getElementById('new-orders-list');
        const activeOrdersList = document.getElementById('active-orders-list');
        const pendingCount = document.getElementById('pending-count');
        const preparingCount = document.getElementById('preparing-count');
        const readyCount = document.getElementById('ready-count');
        const liveCount = document.getElementById('live-count');
        const currentTimeEl = document.getElementById('current-time');
        function handleOrderAction(event) {
            const button = event.target.closest('[data-order-action]');
            if (!button || button.disabled) return;

            event.preventDefault();
            event.stopPropagation();
            button.disabled = true;
            const action = button.dataset.orderAction === 'accept' ?
                acceptOrder(button.dataset.orderId) :
                completeOrder(button.dataset.orderId);
            action.finally(() => {
                if (button.isConnected) button.disabled = false;
            });
        }

        newOrdersList.addEventListener('click', handleOrderAction, true);
        activeOrdersList.addEventListener('click', handleOrderAction, true);

        // ============ INITIALIZATION ============
        async function init() {
            try {
                if (FloreaOrderSync.isLocal()) {
                    const savedOrders = JSON.parse(localStorage.getItem('florea-cashier-orders') || '[]');
                    orders = savedOrders.length ? savedOrders : JSON.parse(JSON.stringify(sampleOrders));
                } else {
                    const result = await FloreaOrderSync.request('/api/orders');
                    orders = result.orders;
                    hasServerOrders = orders.length > 0;
                }
            } catch (error) {
                console.error('Unable to load shared cashier orders.', error);
                alert(`The cashier could not connect to the shared order service. ${error.message}`);
                orders = [];
            }
            orders.forEach(order => {
                order.timestamp = new Date(order.timestamp);
            });
            renderOrders();
            updateStats();
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(syncOrdersFromStorage, 3000);
            if (FloreaOrderSync.isLocal()) setInterval(simulateNewOrder, 15000);
        }

        // ============ RENDER ORDERS ============
        function renderOrders() {
            const newOrders = orders.filter(o => o.status === 'new');
            const activeOrders = orders.filter(o => o.status !== 'new' && o.status !== 'completed');

            // Render new orders
            if (newOrders.length === 0) {
                newOrdersList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">😎</div>
                        <p>No new orders yet</p>
                    </div>
                `;
            } else {
                newOrdersList.innerHTML = newOrders.map(o => createOrderCard(o)).join('');
                attachOrderListeners();
            }

            // Render active orders
            if (activeOrders.length === 0) {
                activeOrdersList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <p>Walang kasalukuyang inihahanda</p>
                    </div>
                `;
            } else {
                activeOrdersList.innerHTML = activeOrders.map(o => createOrderCard(o)).join('');
                attachOrderListeners();
            }
        }

        // ============ CREATE ORDER CARD ============
        function createOrderCard(order) {
            const timeElapsed = Math.floor((Date.now() - order.timestamp) / 60000);
            const overdue = order.status === 'new' && timeElapsed >= 15;
            const statusClass = `${order.status === 'new' ? 'new' : ''}${overdue ? ' overdue' : ''}`;

            return `
                <div class="order-card ${statusClass}" data-order-id="${order.id}">
                    <div class="order-header">
                        <div>
                            <div class="order-customer">Customer: <b>${FloreaOrderSync.escapeText(order.customerName || 'Guest')}</b></div>
                            <div class="order-time${overdue ? ' overdue' : ''}">${timeElapsed}m ago</div>
                            ${overdue ? '<div class="overdue-label">Needs attention · waiting 15+ min</div>' : ''}
                        </div>
                    </div>
                    <div class="order-details">
                        Total: <b>${order.total}</b>
                    </div>
                    <div class="order-items">${FloreaOrderSync.renderOrderItems(order)}</div>
                    <div class="order-status">
                        <span class="status-badge ${getStatusClass(order.status)}">${order.status}</span>
                    </div>
                    <div class="order-actions">
                        ${order.status === 'new' ? `
                            <button type="button" class="btn-accept" data-order-action="accept" data-order-id="${FloreaOrderSync.escapeText(order.id)}">✓ Accept</button>
                        ` : ''}
                        ${order.status === 'preparing' ? `
                            <button type="button" class="btn-complete" data-order-action="ready" data-order-id="${FloreaOrderSync.escapeText(order.id)}">✓ Ready</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ============ GET STATUS CLASS ============
        function getStatusClass(status) {
            switch (status) {
                case 'new':
                case 'pending':
                    return 'status-pending';
                case 'preparing':
                    return 'status-preparing';
                case 'ready':
                    return 'status-ready';
                default:
                    return 'status-pending';
            }
        }

        // ============ ACCEPT ORDER ============
        async function acceptOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                try {
                    await saveOrderStatus(order.id, 'preparing');
                } catch (error) {
                    console.error('Unable to update order status.', error);
                    alert(`The order status could not be updated. ${error.message}`);
                    return;
                }
                order.status = 'preparing';
                renderOrders();
                updateStats();
            }
        }

        // ============ COMPLETE ORDER ============
        async function completeOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                try {
                    await saveOrderStatus(order.id, 'ready');
                } catch (error) {
                    console.error('Unable to update order status.', error);
                    alert(`The order status could not be updated. ${error.message}`);
                    return;
                }
                order.status = 'ready';
                renderOrders();
                updateStats();
                setTimeout(() => {
                    removeOrder(orderId).then(() => {
                        orders = orders.filter(o => o.id !== orderId);
                        renderOrders();
                        updateStats();
                    }).catch(error => {
                        console.error('Unable to remove completed order.', error);
                    });
                }, 30000);
            }
        }

        // ============ UPDATE STATS ============
        function updateStats() {
            const pending = orders.filter(o => o.status === 'pending' || o.status === 'new').length;
            const preparing = orders.filter(o => o.status === 'preparing').length;
            const ready = orders.filter(o => o.status === 'ready').length;
            const live = orders.filter(o => o.status !== 'completed').length;

            pendingCount.textContent = pending;
            preparingCount.textContent = preparing;
            readyCount.textContent = ready;
            liveCount.textContent = live;
        }

        function saveOrders() {
            localStorage.setItem('florea-cashier-orders', JSON.stringify(orders));
        }

        async function saveOrderStatus(orderId, status) {
            if (FloreaOrderSync.isLocal()) {
                const order = orders.find(item => item.id === orderId);
                if (order) order.status = status;
                saveOrders();
                return;
            }
            await FloreaOrderSync.request(`/api/orders/${encodeURIComponent(orderId)}`, {
                method: 'PATCH',
                body: JSON.stringify({ status })
            });
        }

        async function removeOrder(orderId) {
            if (FloreaOrderSync.isLocal()) {
                orders = orders.filter(order => order.id !== orderId);
                saveOrders();
                return;
            }
            await FloreaOrderSync.request(`/api/orders/${encodeURIComponent(orderId)}`, { method: 'DELETE' });
        }

        async function syncOrdersFromStorage() {
            try {
                if (!FloreaOrderSync.isLocal()) {
                    const result = await FloreaOrderSync.request('/api/orders');
                    const nextOrders = result.orders.map(order => ({
                        ...order,
                        timestamp: new Date(order.timestamp)
                    }));
                    const receivedNewOrder = nextOrders.some(order =>
                        order.status === 'new' && !orders.some(current => current.id === order.id)
                    );
                    const receivedOrder = nextOrders.find(order =>
                        order.status === 'new' && !orders.some(current => current.id === order.id)
                    );
                    if (nextOrders.length) hasServerOrders = true;
                    const currentSerialized = JSON.stringify(orders.map(order => ({
                        ...order,
                        timestamp: new Date(order.timestamp).toISOString()
                    })));
                    const nextSerialized = JSON.stringify(nextOrders.map(order => ({
                        ...order,
                        timestamp: order.timestamp.toISOString()
                    })));
                    hasSyncError = false;
                    if (!hasServerOrders || currentSerialized === nextSerialized) return;
                    orders = nextOrders;
                    if (receivedNewOrder) {
                        playNewOrderBell();
                    }
                    renderOrders();
                    updateStats();
                    return;
                }

                const savedOrders = JSON.parse(localStorage.getItem('florea-cashier-orders') || '[]');
                if (!savedOrders.length || JSON.stringify(orders) === JSON.stringify(savedOrders)) return;

                const receivedOrder = savedOrders.find(order =>
                    order.status === 'new' && !orders.some(current => current.id === order.id)
                );
                orders = savedOrders;
                orders.forEach(order => {
                    order.timestamp = new Date(order.timestamp);
                });
                if (receivedOrder) {
                    playNewOrderBell();
                }
                renderOrders();
                updateStats();
            } catch (error) {
                if (!hasSyncError) {
                    console.error('Unable to sync shared cashier orders.', error);
                    hasSyncError = true;
                }
            }
        }

        window.addEventListener('storage', (event) => {
            if (!FloreaOrderSync.isLocal() || event.key !== 'florea-cashier-orders') return;
            try {
                const nextOrders = JSON.parse(event.newValue || '[]');
                const receivedOrder = nextOrders.find(order =>
                    order.status === 'new' && !orders.some(current => current.id === order.id)
                );
                orders = nextOrders;
                orders.forEach(order => {
                    order.timestamp = new Date(order.timestamp);
                });
                if (receivedOrder) {
                    playNewOrderBell();
                }
                renderOrders();
                updateStats();
            } catch (error) {
                console.warn('Unable to refresh shared cashier orders.', error);
            }
        });

        // ============ UPDATE TIME ============
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            currentTimeEl.textContent = `${hours}:${minutes}`;
        }

        // ============ PLAY NOTIFICATION ============
        function playNewOrderBell() {
            window.FloreaCashierSound.play();
        }

        // ============ SIMULATE NEW ORDER ============
        function simulateNewOrder() {
            if (orders.length >= 8) return; // Limit to 8 orders

            const items = [
                ['Ecuadorian Roses (6pc)', 'Iced Americano (Medium)'],
                ['Sunflower Stem', 'Americano (Medium)', 'Croissant'],
                ['Sweetheart Peony Bouquet'],
                ['Tulip Bundle', 'Spanish Latte (Medium)'],
                ['Mixed Flowers', 'Pastry Platter'],
                ['Single Stem', 'Spanish Latte (Medium)']
            ];

            const tables = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'];
            const randomItems = items[Math.floor(Math.random() * items.length)];
            const randomTable = tables[Math.floor(Math.random() * tables.length)];
            const prices = ['₱ 450', '₱ 650', '₱ 890', '₱ 1,200', '₱ 1,500'];
            const randomPrice = prices[Math.floor(Math.random() * prices.length)];

            const newOrder = {
                id: `ORD-${orderIdCounter++}`,
                items: randomItems,
                total: randomPrice,
                table: randomTable,
                timestamp: new Date(),
                status: 'new'
            };

            orders.unshift(newOrder);
            renderOrders();
            updateStats();
            playNewOrderBell();
        }

        // ============ ATTACH EVENT LISTENERS ============
        function attachOrderListeners() {
            // Event listeners attached via onclick attributes
        }

        // ============ START ============
        init();
    </script>
</body>

</html>
