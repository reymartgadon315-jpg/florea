<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Floréa — Cashier Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="florea-prototype.css">
    <style>
        .cashier-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 24px;
            height: calc(100vh - 100px);
            overflow: auto;
            background: var(--cream-deep);
        }
        
        .cashier-section {
            display: flex;
            flex-direction: column;
            background: var(--paper);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .cashier-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .order-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .order-card {
            background: var(--cream);
            border-left: 4px solid var(--sage);
            border-radius: var(--radius-sm);
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .order-card:hover {
            box-shadow: 0 4px 12px rgba(59, 47, 42, .12);
            transform: translateY(-2px);
        }
        
        .order-card.new {
            border-left-color: var(--danger);
            background: rgba(193, 89, 78, 0.08);
            animation: pulse 1s infinite;
        }
        
        .order-card.new::before {
            content: "NEW";
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--danger);
            background: rgba(193, 89, 78, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
        }
        
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(193, 89, 78, 0.7);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(193, 89, 78, 0);
            }
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }
        
        .order-id {
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-mono);
            font-size: 13px;
        }
        
        .order-customer {
            margin-top: 4px;
            font-size: 13px;
            color: var(--ink);
        }
        
        .order-time {
            font-size: 11px;
            color: var(--ink-soft);
            font-family: var(--font-mono);
        }
        
        .order-details {
            font-size: 13px;
            color: var(--ink-soft);
            margin: 8px 0;
            line-height: 1.5;
        }
        
        .order-items {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            color: var(--ink);
            max-height: 80px;
            overflow-y: auto;
        }
        
        .order-items li {
            margin: 3px 0;
            margin-left: 16px;
        }
        
        .order-status {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending {
            background: rgba(198, 161, 91, 0.2);
            color: var(--gold);
        }
        
        .status-preparing {
            background: rgba(156, 192, 139, 0.2);
            color: var(--forest-light);
        }
        
        .status-ready {
            background: rgba(156, 192, 139, 0.3);
            color: var(--sage-deep);
        }
        
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .order-actions button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-accept {
            background: var(--forest);
            color: #FBF7F1;
        }
        
        .btn-accept:hover {
            background: var(--forest-deep);
        }
        
        .btn-complete {
            background: var(--forest-light);
            color: var(--forest);
        }
        
        .btn-complete:hover {
            background: var(--sage-deep);
            color: #FBF7F1;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px 24px;
            background: var(--cream);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-mono);
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--ink-soft);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--ink-soft);
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .notification-sound {
            display: none;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .dashboard-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
        }
        
        .dashboard-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--ink-soft);
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--forest-light);
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        @media (max-width: 1200px) {
            .cashier-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app" style="flex-direction: column;">

        <!-- TOPBAR -->
        <div class="topbar">
            <div>
                <h1 class="dashboard-title">🍃 Cashier Dashboard</h1>
            </div>
            <div class="dashboard-status">
                <span class="status-indicator"></span>
                <span>Live Orders: <b id="live-count">0</b></span>
                <span>•</span>
                <span>Time: <span id="current-time">--:--</span></span>
            </div>
        </div>

        <!-- STATS BAR -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="pending-count">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="preparing-count">0</div>
                <div class="stat-label">Preparing</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="ready-count">0</div>
                <div class="stat-label">Ready</div>
            </div>
        </div>

        <!-- MAIN CONTAINER -->
        <div class="cashier-container">

            <!-- NEW ORDERS SECTION -->
            <div class="cashier-section">
                <h2>📬 New Orders</h2>
                <div class="order-list" id="new-orders-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">😎</div>
                        <p>No new orders yet</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVE ORDERS SECTION -->
            <div class="cashier-section">
                <h2>⏳ Active Orders</h2>
                <div class="order-list" id="active-orders-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <p>All clear! No orders in progress</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <audio id="notification-audio" class="notification-sound">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj==" type="audio/wav">
    </audio>

    <script>
        // ============ ORDER DATA ============
        let orders = [];
        let orderIdCounter = 1001;

        // Sample order data
        const sampleOrders = [{
            id: 'ORD-1001',
            items: ['Ecuadorian Roses (6pc)', 'Iced Latte', 'Croissant'],
            total: '₱ 890',
            table: '12',
            timestamp: new Date(Date.now() - 2 * 60000),
            status: 'new'
        }, {
            id: 'ORD-1002',
            items: ['Sunflower Stem (3)', 'Cappuccino'],
            total: '₱ 450',
            table: '08',
            timestamp: new Date(Date.now() - 5 * 60000),
            status: 'new'
        }, {
            id: 'ORD-1003',
            items: ['Sweetheart Peony Bouquet', 'Espresso'],
            total: '₱ 1,280',
            table: '05',
            timestamp: new Date(Date.now() - 8 * 60000),
            status: 'preparing'
        }];

        // ============ DOM ELEMENTS ============
        const newOrdersList = document.getElementById('new-orders-list');
        const activeOrdersList = document.getElementById('active-orders-list');
        const pendingCount = document.getElementById('pending-count');
        const preparingCount = document.getElementById('preparing-count');
        const readyCount = document.getElementById('ready-count');
        const liveCount = document.getElementById('live-count');
        const currentTimeEl = document.getElementById('current-time');
        const notificationAudio = document.getElementById('notification-audio');

        // ============ INITIALIZATION ============
        function init() {
            try {
                const savedOrders = JSON.parse(localStorage.getItem('florea-cashier-orders') || '[]');
                orders = savedOrders.length ? savedOrders : JSON.parse(JSON.stringify(sampleOrders));
            } catch (error) {
                orders = JSON.parse(JSON.stringify(sampleOrders));
            }
            orders.forEach(order => {
                order.timestamp = new Date(order.timestamp);
            });
            renderOrders();
            updateStats();
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(syncOrdersFromStorage, 1000);
            setInterval(simulateNewOrder, 15000);
        }

        // ============ RENDER ORDERS ============
        function renderOrders() {
            const newOrders = orders.filter(o => o.status === 'new');
            const activeOrders = orders.filter(o => o.status !== 'new' && o.status !== 'completed');

            // Render new orders
            if (newOrders.length === 0) {
                newOrdersList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">😎</div>
                        <p>No new orders yet</p>
                    </div>
                `;
            } else {
                newOrdersList.innerHTML = newOrders.map(o => createOrderCard(o)).join('');
                attachOrderListeners();
            }

            // Render active orders
            if (activeOrders.length === 0) {
                activeOrdersList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✨</div>
                        <p>All clear! No orders in progress</p>
                    </div>
                `;
            } else {
                activeOrdersList.innerHTML = activeOrders.map(o => createOrderCard(o)).join('');
                attachOrderListeners();
            }
        }

        // ============ CREATE ORDER CARD ============
        function createOrderCard(order) {
            const timeElapsed = Math.floor((Date.now() - order.timestamp) / 60000);
            const statusClass = order.status === 'new' ? 'new' : '';

            return `
                <div class="order-card ${statusClass}" data-order-id="${order.id}">
                    <div class="order-header">
                        <div>
                            <div class="order-id">${order.id} • Table ${order.table}</div>
                            <div class="order-customer">Customer: <b>${order.customerName || 'Guest'}</b></div>
                            <div class="order-time">${timeElapsed}m ago</div>
                        </div>
                    </div>
                    <div class="order-details">
                        Total: <b>${order.total}</b>
                    </div>
                    <div class="order-items">
                        <ul style="margin: 0; padding-left: 16px;">
                            ${order.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="order-status">
                        <span class="status-badge ${getStatusClass(order.status)}">${order.status}</span>
                    </div>
                    <div class="order-actions">
                        ${order.status === 'new' ? `
                            <button class="order-actions button btn-accept" onclick="acceptOrder('${order.id}')">✓ Accept</button>
                        ` : ''}
                        ${order.status === 'preparing' ? `
                            <button class="order-actions button btn-complete" onclick="completeOrder('${order.id}')">✓ Ready</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ============ GET STATUS CLASS ============
        function getStatusClass(status) {
            switch (status) {
                case 'new':
                case 'pending':
                    return 'status-pending';
                case 'preparing':
                    return 'status-preparing';
                case 'ready':
                    return 'status-ready';
                default:
                    return 'status-pending';
            }
        }

        // ============ ACCEPT ORDER ============
        function acceptOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'preparing';
                saveOrders();
                renderOrders();
                updateStats();
                playNotification();
            }
        }

        // ============ COMPLETE ORDER ============
        function completeOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'ready';
                saveOrders();
                renderOrders();
                updateStats();
                playNotification();
                // Remove after 30 seconds
                setTimeout(() => {
                    orders = orders.filter(o => o.id !== orderId);
                    saveOrders();
                    renderOrders();
                    updateStats();
                }, 30000);
            }
        }

        // ============ UPDATE STATS ============
        function updateStats() {
            const pending = orders.filter(o => o.status === 'pending' || o.status === 'new').length;
            const preparing = orders.filter(o => o.status === 'preparing').length;
            const ready = orders.filter(o => o.status === 'ready').length;
            const live = orders.filter(o => o.status !== 'completed').length;

            pendingCount.textContent = pending;
            preparingCount.textContent = preparing;
            readyCount.textContent = ready;
            liveCount.textContent = live;
        }

        function saveOrders() {
            localStorage.setItem('florea-cashier-orders', JSON.stringify(orders));
        }

        function syncOrdersFromStorage() {
            try {
                const savedOrders = JSON.parse(localStorage.getItem('florea-cashier-orders') || '[]');
                if (!savedOrders.length || JSON.stringify(orders) === JSON.stringify(savedOrders)) return;

                orders = savedOrders;
                orders.forEach(order => {
                    order.timestamp = new Date(order.timestamp);
                });
                renderOrders();
                updateStats();
            } catch (error) {
                console.warn('Unable to poll shared cashier orders.', error);
            }
        }

        window.addEventListener('storage', (event) => {
            if (event.key !== 'florea-cashier-orders') return;
            try {
                orders = JSON.parse(event.newValue || '[]');
                orders.forEach(order => {
                    order.timestamp = new Date(order.timestamp);
                });
                renderOrders();
                updateStats();
            } catch (error) {
                console.warn('Unable to refresh shared cashier orders.', error);
            }
        });

        // ============ UPDATE TIME ============
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            currentTimeEl.textContent = `${hours}:${minutes}`;
        }

        // ============ PLAY NOTIFICATION ============
        function playNotification() {
            notificationAudio.currentTime = 0;
            notificationAudio.play().catch(() => {});
        }

        // ============ SIMULATE NEW ORDER ============
        function simulateNewOrder() {
            if (orders.length >= 8) return; // Limit to 8 orders

            const items = [
                ['Ecuadorian Roses (6pc)', 'Iced Latte'],
                ['Sunflower Stem', 'Cappuccino', 'Croissant'],
                ['Sweetheart Peony Bouquet'],
                ['Tulip Bundle', 'Espresso'],
                ['Mixed Flowers', 'Pastry Platter'],
                ['Single Stem', 'Flat White']
            ];

            const tables = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'];
            const randomItems = items[Math.floor(Math.random() * items.length)];
            const randomTable = tables[Math.floor(Math.random() * tables.length)];
            const prices = ['₱ 450', '₱ 650', '₱ 890', '₱ 1,200', '₱ 1,500'];
            const randomPrice = prices[Math.floor(Math.random() * prices.length)];

            const newOrder = {
                id: `ORD-${orderIdCounter++}`,
                items: randomItems,
                total: randomPrice,
                table: randomTable,
                timestamp: new Date(),
                status: 'new'
            };

            orders.unshift(newOrder);
            renderOrders();
            updateStats();
            playNotification();
        }

        // ============ ATTACH EVENT LISTENERS ============
        function attachOrderListeners() {
            // Event listeners attached via onclick attributes
        }

        // ============ START ============
        init();
    </script>
</body>

</html>
