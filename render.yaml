services:
  - type: web
    name: florea
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: postgres
      - key: API_MAINTENANCE_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: florea-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: CASHIER_PASSWORD
        sync: false
      - key: CASHIER_SESSION_SECRET
        sync: false

databases:
  - name: florea-db
    plan: 0.1c-256mb
    databaseName: florea
    user: florea
